name: Keep Supabase Awake (Auto Heartbeat)

on:
  schedule:
    # Run every day at 00:00 UTC (07:00 AM ICT)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database API
        run: |
          curl -s -X GET "https://rawqaihrdxfomrhqjolu.supabase.co/rest/v1/media?select=id&limit=1" \
            -H "apikey: sb_publishable_tDg5nx6DL0U-3u0ThwQaSA_2cF5ePoo" \
            -H "Authorization: Bearer sb_publishable_tDg5nx6DL0U-3u0ThwQaSA_2cF5ePoo"
          echo "Supabase successfully pinged to prevent sleeping!"
